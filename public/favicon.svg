<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background for app icon, optional, keeping transparent for favicon -->
  <g transform="translate(40, 40) scale(0.8)">
    <!-- Outer D shape in Navy -->
    <path d="M 100 50 L 200 50 C 300 50 350 120 350 200 C 350 280 300 350 200 350 L 100 350" fill="none" stroke="#082554" stroke-width="45" stroke-linecap="round"/>
    
    <!-- Connecting lines -->
    <path d="M 40 50 L 140 180" stroke="#082554" stroke-width="15" stroke-linecap="round" />
    <path d="M 40 350 L 140 220" stroke="#082554" stroke-width="15" stroke-linecap="round" />
    <path d="M 140 180 L 100 200 L 140 220" fill="#082554" />

    <!-- Top Left Dot (Green) -->
    <circle cx="40" cy="50" r="30" fill="#16864C" />
    <!-- Middle Left Dot (Gold) -->
    <circle cx="90" cy="200" r="25" fill="#C49A2C" />
    <!-- Bottom Left Dot (Navy) -->
    <circle cx="40" cy="350" r="30" fill="#082554" />

    <!-- Bar Chart (Green) -->
    <rect x="180" y="240" width="30" height="70" fill="#16864C" rx="5" />
    <rect x="230" y="190" width="30" height="120" fill="#16864C" rx="5" />
    <rect x="280" y="140" width="30" height="170" fill="#16864C" rx="5" />
  </g>
</svg>